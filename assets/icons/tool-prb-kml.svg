  <line x1="16" y1="25" x2="16" y2="29" stroke="#0284C7" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="6.5" y1="12" x2="6.5" y2="15.5" stroke="#0284C7" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="25.5" y1="12" x2="25.5" y2="15.5" stroke="#0284C7" stroke-width="1.5" stroke-linecap="round"/>
