<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- GIS Coordinate Bounding Frame -->
  <rect x="4" y="4" width="24" height="24" rx="3" stroke="#0284C7" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- ESRI Polygon Feature Layer (Indigo Accent) -->
  <polygon points="7,11 18,6 26,12 22,25 9,23" fill="#6366F1" fill-opacity="0.18" stroke="#4F46E5" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Sub-Polygon / Spatial Partition (Sky Accent) -->
  <polygon points="12,17 18,6 26,12 19,20" fill="#0EA5E9" fill-opacity="0.22" stroke="#0284C7" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Polygon Vertex Nodes (Crisp White with Indigo Ring) -->
  <circle cx="7" cy="11" r="2" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.4"/>
  <circle cx="18" cy="6" r="2" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.4"/>
  <circle cx="26" cy="12" r="2" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.4"/>
  <circle cx="22" cy="25" r="2" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.4"/>
  <circle cx="9" cy="23" r="2" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.4"/>
</svg>