<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Vertical Plumb Reference Axis (0° Mechanical Datum) -->
  <line x1="11" y1="4" x2="11" y2="28" stroke="#64748B" stroke-width="1.2" stroke-dasharray="2 2" stroke-opacity="0.5"/>
  <text x="11" y="3.5" fill="#64748B" font-size="3.2" font-weight="bold" font-family="sans-serif" text-anchor="middle">0°</text>

  <!-- Antenna Mast Mounting Bracket -->
  <line x1="6" y1="12" x2="11" y2="12" stroke="#0284C7" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="11" cy="12" r="2" fill="#0284C7"/>
  <circle cx="11" cy="12" r="0.8" fill="#FFFFFF"/>

  <!-- Tilted Antenna Panel Assembly (Mechanical + Electrical Tilt) -->
  <g transform="rotate(18 11 12)">
    <!-- Antenna Housing -->
    <rect x="9.5" y="5" width="3" height="14" rx="1" fill="#0284C7" fill-opacity="0.2" stroke="#0284C7" stroke-width="1.5"/>
    <!-- Phase Shifted Internal Array Slots (Electrical Tilt simulation) -->
    <line x1="11" y1="8" x2="11" y2="9.5" stroke="#0284C7" stroke-width="1.2"/>
    <line x1="11" y1="11" x2="11" y2="12.5" stroke="#0284C7" stroke-width="1.2"/>
    <line x1="11" y1="14" x2="11" y2="15.5" stroke="#0284C7" stroke-width="1.2"/>
  </g>

  <!-- Tilt Angle Arc & Indicator Arrow (Theta / NetTilt) -->
  <path d="M11 20A8 8 0 0 0 15 17.5" stroke="#D97706" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M13.5 17L15.5 17.2L15 19" stroke="#D97706" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="17.5" y="21.5" fill="#D97706" font-size="4" font-weight="bold" font-family="sans-serif">θ°</text>

  <!-- 3D Boresight & Beam Elevation Cone Rays -->
  <!-- Upper Half-Power Ray -->
  <line x1="12" y1="13" x2="27" y2="19" stroke="#0EA5E9" stroke-width="1.2" stroke-dasharray="2 2" stroke-opacity="0.75"/>
  <!-- Main Boresight Center Vector -->
  <line x1="12" y1="13" x2="28" y2="24" stroke="#4F46E5" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Lower Half-Power Ray -->
  <line x1="12" y1="13" x2="25" y2="28" stroke="#0EA5E9" stroke-width="1.2" stroke-dasharray="2 2" stroke-opacity="0.75"/>

  <!-- 3D Beam Ellipse Indicator -->
  <ellipse cx="26" cy="23.5" rx="3.5" ry="5" transform="rotate(-15 26 23.5)" fill="#6366F1" fill-opacity="0.18" stroke="#4F46E5" stroke-width="1.2"/>
</svg>
