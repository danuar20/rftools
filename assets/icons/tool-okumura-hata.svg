<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Ground Baseline -->
  <line x1="3" y1="26" x2="29" y2="26" stroke="#0284C7" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.35"/>

  <!-- Urban Environment Building Blocks (Hata Terrain) -->
  <rect x="11" y="19" width="3.5" height="7" rx="0.5" fill="#4F46E5" fill-opacity="0.16" stroke="#4F46E5" stroke-width="1"/>
  <rect x="15.5" y="16" width="4" height="10" rx="0.5" fill="#4F46E5" fill-opacity="0.22" stroke="#4F46E5" stroke-width="1"/>
  <rect x="20.5" y="20" width="3.5" height="6" rx="0.5" fill="#4F46E5" fill-opacity="0.16" stroke="#4F46E5" stroke-width="1"/>

  <!-- Macro Base Station Tower (hb) on Left -->
  <path d="M4 26L6.5 8L9 26" stroke="#0284C7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="4.8" y1="20" x2="8.2" y2="20" stroke="#0284C7" stroke-width="1.1"/>
  <line x1="5.5" y1="14" x2="7.5" y2="14" stroke="#0284C7" stroke-width="1.1"/>
  <circle cx="6.5" cy="8" r="2.2" fill="#0284C7"/>
  <circle cx="6.5" cy="8" r="0.9" fill="#FFFFFF"/>

  <!-- Mobile Station (hm) on Right -->
  <rect x="25" y="18" width="4.5" height="8" rx="1" fill="#10B981" fill-opacity="0.2" stroke="#059669" stroke-width="1.3"/>
  <line x1="26.2" y1="18" x2="26.2" y2="15" stroke="#059669" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="26.2" cy="14.5" r="1" fill="#059669"/>
  <!-- Handset Screen -->
  <rect x="25.8" y="19.5" width="2.9" height="3.5" rx="0.3" fill="#10B981" fill-opacity="0.6"/>

  <!-- Okumura-Hata Logarithmic Path Loss Attenuation Wave Curve -->
  <path d="M7 8C12 9 14 13.5 25.5 15" stroke="#0284C7" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Diffracted / Multipath Scatter Ray -->
  <path d="M7 8L17.5 16L25.5 17" stroke="#EF4444" stroke-width="1.2" stroke-dasharray="2 1.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.8"/>
</svg>
