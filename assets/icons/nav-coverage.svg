<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- RF Transmission Propagation Wavefronts -->
  <!-- Outer Far Wave Arc -->
  <path d="M14 6C20.63 6 26 11.37 26 18C26 20.8 25.04 23.38 23.42 25.42" stroke="#0284C7" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 2" stroke-opacity="0.5"/>
  
  <!-- Mid Coverage Wave Arc -->
  <path d="M14 10C18.42 10 22 13.58 22 18C22 19.95 21.3 21.74 20.14 23.14" stroke="#0284C7" stroke-width="1.8" stroke-linecap="round"/>
  
  <!-- Near Core Wave Arc -->
  <path d="M14 14C16.21 14 18 15.79 18 18" stroke="#0EA5E9" stroke-width="2" stroke-linecap="round"/>

  <!-- Cellular Base Station Mast -->
  <path d="M8 26L13.5 13L14.5 13L20 26" stroke="#0284C7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Mast Cross Bracing -->
  <line x1="10.2" y1="21" x2="17.8" y2="21" stroke="#0284C7" stroke-width="1.3"/>
  <line x1="11.8" y1="17" x2="16.2" y2="17" stroke="#0284C7" stroke-width="1.2"/>
  <line x1="10.5" y1="21" x2="16" y2="17" stroke="#0284C7" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="17.5" y1="21" x2="12" y2="17" stroke="#0284C7" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Antenna Mast Head / Emitter -->
  <line x1="14" y1="13" x2="14" y2="9.5" stroke="#0284C7" stroke-width="2" stroke-linecap="round"/>
  <circle cx="14" cy="9" r="2.5" fill="#0284C7"/>
  <circle cx="14" cy="9" r="1" fill="#FFFFFF"/>

  <!-- Ground Elevation Baseline -->
  <line x1="4" y1="26" x2="28" y2="26" stroke="#0284C7" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.35"/>
</svg>
