<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Ground Horizon Reference Line -->
  <line x1="3" y1="26" x2="29" y2="26" stroke="#0284C7" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.3"/>

  <!-- Projected 3D Coverage Ground Footprint (Heatmap Ellipse) -->
  <ellipse cx="20" cy="24" rx="8.5" ry="3.5" fill="#0EA5E9" fill-opacity="0.18" stroke="#0284C7" stroke-width="1.4" stroke-dasharray="2.5 1.5"/>
  <ellipse cx="20" cy="24" rx="4.5" ry="1.8" fill="#10B981" fill-opacity="0.25" stroke="#10B981" stroke-width="1.2"/>

  <!-- Antenna Tower Structure (Left) -->
  <path d="M4.5 26L7 9.5L9.5 26" stroke="#0284C7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="5.5" y1="20.5" x2="8.5" y2="20.5" stroke="#0284C7" stroke-width="1.2"/>
  <line x1="6.3" y1="15" x2="7.7" y2="15" stroke="#0284C7" stroke-width="1.2"/>

  <!-- Directional Sector Antenna Panel (Tilted) -->
  <rect x="7" y="7" width="2.4" height="6.5" rx="0.8" transform="rotate(18 7 7)" fill="#0284C7" stroke="#0284C7" stroke-width="1"/>

  <!-- Radiation Beam Projection Rays -->
  <!-- Upper (Near Edge) Ray -->
  <line x1="8.5" y1="11" x2="12.5" y2="23" stroke="#0EA5E9" stroke-width="1.2" stroke-dasharray="2 2" stroke-opacity="0.75"/>
  <!-- Lower (Far Edge) Ray -->
  <line x1="8.5" y1="11" x2="28" y2="23" stroke="#0EA5E9" stroke-width="1.2" stroke-dasharray="2 2" stroke-opacity="0.75"/>
  <!-- Main Boresight Center Vector -->
  <line x1="8.5" y1="11" x2="20" y2="24" stroke="#EF4444" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Boresight Ground Intercept Center Point -->
  <circle cx="20" cy="24" r="2.2" fill="#EF4444"/>
  <circle cx="20" cy="24" r="0.8" fill="#FFFFFF"/>

  <!-- Emitter Apex Origin Node -->
  <circle cx="7.5" cy="10" r="2" fill="#0284C7"/>
  <circle cx="7.5" cy="10" r="0.8" fill="#FFFFFF"/>
</svg>
